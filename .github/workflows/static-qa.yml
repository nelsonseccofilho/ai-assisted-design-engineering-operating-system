name: Static QA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_framework.py
      - run: python scripts/test_runtime_sync.py
      - run: python scripts/test_methodology.py
      - run: python scripts/audit_methodology.py --framework .
      - run: python scripts/test_audit_methodology.py
      - run: python scripts/test_onboarding.py
